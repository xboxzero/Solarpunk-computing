<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Solarpunk Meeting Recorder</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
html, body { height:100%; }
body {
  background: #0a0a0a; color: #e0e0e0;
  font-family: 'Menlo', 'Monaco', 'Consolas', monospace;
  font-size: 14px; padding: 12px;
  display: flex; flex-direction: column; gap: 10px;
}
h1 { color: #0f0; font-size: 18px; }
.meta { color: #666; font-size: 12px; }
.bar {
  display: flex; flex-wrap: wrap; gap: 8px; align-items: center;
  background: #111; border: 1px solid #222; border-radius: 6px; padding: 10px;
}
button {
  background: #161616; color: #0f0; border: 1px solid #2a2a2a;
  border-radius: 4px; padding: 6px 12px; cursor: pointer;
  font-family: inherit; font-size: 13px;
}
button:hover:not(:disabled) { background: #1e1e1e; border-color: #0f0; }
button:disabled { color: #444; border-color: #1a1a1a; cursor: not-allowed; }
button.danger { color: #f55; }
button.primary { color: #0af; border-color: #0af; }
button.whisper { color: #fa0; border-color: #553; }
button.whisper:hover:not(:disabled) { border-color: #fa0; }
input[type=text] {
  background: #0a0a0a; color: #e0e0e0; border: 1px solid #2a2a2a;
  border-radius: 4px; padding: 6px 8px; font-family: inherit; font-size: 13px;
  flex: 1; min-width: 200px;
}
.status { display: inline-flex; align-items: center; gap: 6px; }
.dot { width: 10px; height: 10px; border-radius: 50%; background: #444; }
.dot.rec { background: #f00; animation: pulse 1s infinite; }
.dot.on { background: #0f0; }
.dot.busy { background: #fa0; animation: pulse 1s infinite; }
@keyframes pulse { 0%,100% { opacity:1 } 50% { opacity:.3 } }
.timer { color: #ccc; font-variant-numeric: tabular-nums; }
.panes {
  flex: 1; display: grid; grid-template-columns: 1fr 1fr; gap: 10px;
  min-height: 0;
}
@media (max-width: 720px) { .panes { grid-template-columns: 1fr; } }
.pane {
  background: #111; border: 1px solid #222; border-radius: 6px;
  padding: 10px; display: flex; flex-direction: column; min-height: 0;
}
.pane h2 { color: #0af; font-size: 14px; margin-bottom: 8px; display: flex; gap: 8px; align-items: center; }
.pane .tag { color: #777; font-size: 11px; font-weight: normal; padding: 1px 6px; border: 1px solid #2a2a2a; border-radius: 3px; }
.scroll {
  flex: 1; overflow-y: auto; background: #0a0a0a; border: 1px solid #1a1a1a;
  border-radius: 4px; padding: 8px; font-size: 13px; line-height: 1.5;
  white-space: pre-wrap; word-break: break-word;
}
.transcript .final { color: #ddd; }
.transcript .interim { color: #777; font-style: italic; }
.transcript .placeholder { color: #555; font-style: italic; }
.transcript .seg { display: block; padding: 4px 0; border-bottom: 1px dashed #1a1a1a; }
.transcript .seg .ts { color: #0af; font-size: 11px; margin-right: 6px; }
.note { padding: 4px 0; border-bottom: 1px solid #1a1a1a; }
.note:last-child { border-bottom: none; }
.note .ts { color: #0af; font-size: 11px; margin-right: 6px; }
.note .txt { color: #ddd; }
.note .src { color: #555; font-size: 10px; margin-left: 6px; }
.error { color: #f55; font-size: 12px; padding: 6px 10px; background: #2a0a0a; border-radius: 4px; display: none; }
.error.show { display: block; }
.note-input { display: flex; gap: 6px; margin-top: 8px; }
.lang-select {
  background: #0a0a0a; color: #e0e0e0; border: 1px solid #2a2a2a;
  border-radius: 4px; padding: 6px 8px; font-family: inherit; font-size: 13px;
}
.modes { font-size: 11px; color: #555; margin-top: -2px; }
.modes b { color: #888; font-weight: normal; }
</style>
</head>
<body>

<h1>Meeting Recorder</h1>
<div class="meta">Captures mic audio, optional live transcription (Chrome/Edge), high-quality transcription via Whisper API, manual notes, export to Markdown or Google Docs.</div>
<div class="modes" id="modes"></div>

<div class="bar">
  <button id="btnRec" class="primary">Start Recording</button>
  <button id="btnPause" disabled>Pause</button>
  <button id="btnClear" class="danger">Clear</button>
  <span class="status"><span id="dot" class="dot"></span><span id="state">idle</span></span>
  <span class="timer" id="timer">00:00</span>
  <select id="lang" class="lang-select" title="Recognition / Whisper language">
    <option value="en-US">en-US</option>
    <option value="en-GB">en-GB</option>
    <option value="es-ES">es-ES</option>
    <option value="fr-FR">fr-FR</option>
    <option value="de-DE">de-DE</option>
    <option value="it-IT">it-IT</option>
    <option value="pt-BR">pt-BR</option>
    <option value="ja-JP">ja-JP</option>
    <option value="zh-CN">zh-CN</option>
  </select>
  <input id="title" type="text" placeholder="Meeting title (used as Doc title)">
</div>

<div class="bar">
  <button id="btnWhisper" class="whisper" disabled>Transcribe with Whisper</button>
  <button id="btnDownloadAudio" disabled>Download audio</button>
  <button id="btnDownload">Download .md</button>
  <button id="btnCopy">Copy to clipboard</button>
  <button id="btnOpenDoc" class="primary">Open in Google Docs</button>
  <button id="btnSaveDrive">Save to Drive</button>
  <span class="meta" id="hint">Tip: paste into the opened Doc, or drop the downloaded file in Drive.</span>
</div>

<div class="error" id="err"></div>

<div class="panes">
  <div class="pane">
    <h2><span id="transcriptHeading">Live transcript</span><span id="transcriptTag" class="tag"></span></h2>
    <div id="transcript" class="scroll transcript"></div>
  </div>
  <div class="pane">
    <h2>Notes (timestamped)</h2>
    <div id="notes" class="scroll"></div>
    <div class="note-input">
      <input id="noteIn" type="text" placeholder="Type a note and press Enter…">
      <button id="btnAddNote">Add</button>
      <button id="btnMark">Mark moment</button>
    </div>
  </div>
</div>

<script>
const $ = (id) => document.getElementById(id);
const btnRec = $('btnRec');
const btnPause = $('btnPause');
const btnClear = $('btnClear');
const btnWhisper = $('btnWhisper');
const btnDownloadAudio = $('btnDownloadAudio');
const btnDownload = $('btnDownload');
const btnCopy = $('btnCopy');
const btnOpenDoc = $('btnOpenDoc');
const btnSaveDrive = $('btnSaveDrive');
const btnAddNote = $('btnAddNote');
const btnMark = $('btnMark');
const transcriptEl = $('transcript');
const transcriptHeading = $('transcriptHeading');
const transcriptTag = $('transcriptTag');
const notesEl = $('notes');
const noteIn = $('noteIn');
const titleEl = $('title');
const langEl = $('lang');
const dotEl = $('dot');
const stateEl = $('state');
const timerEl = $('timer');
const errEl = $('err');
const modesEl = $('modes');

const caps = {
  speech: !!(window.SpeechRecognition || window.webkitSpeechRecognition),
  audio: typeof MediaRecorder !== 'undefined',
  whisper: false, // probed at startup via /health
  secure: window.isSecureContext === true,
  mediaDevices: !!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia),
};

function httpsUrlForThisHost(tlsPort) {
  // Builds an https URL on the same hostname for a given TLS port (default 8845).
  const host = window.location.hostname || 'localhost';
  return 'https://' + host + ':' + (tlsPort || 8845) + '/';
}

const state = {
  recording: false,
  paused: false,
  startedAt: null,
  elapsedBeforePause: 0,
  recognition: null,
  finalChunks: [],     // {t, text}
  notes: [],           // {t, text, source}
  interim: '',
  // audio
  mediaRecorder: null,
  audioStream: null,
  audioChunks: [],
  audioBlob: null,
  audioMime: null,
  // whisper
  whisperUsed: false,
};

function fmtTime(sec) {
  sec = Math.max(0, Math.floor(sec));
  const h = Math.floor(sec / 3600);
  const m = Math.floor((sec % 3600) / 60);
  const s = sec % 60;
  const pad = n => String(n).padStart(2, '0');
  return h > 0 ? `${pad(h)}:${pad(m)}:${pad(s)}` : `${pad(m)}:${pad(s)}`;
}

function nowOffset() {
  if (!state.startedAt) return state.elapsedBeforePause;
  const live = state.paused ? 0 : (Date.now() - state.startedAt) / 1000;
  return state.elapsedBeforePause + live;
}

function showError(msg) { errEl.textContent = msg; errEl.classList.add('show'); }
function clearError() { errEl.classList.remove('show'); errEl.textContent = ''; }

function setStatus(label, cls) {
  stateEl.textContent = label;
  dotEl.className = 'dot' + (cls ? ' ' + cls : '');
}

function setTranscriptTag(text) { transcriptTag.textContent = text || ''; }

function renderTranscript() {
  if (state.whisperUsed && state.finalChunks.length) {
    transcriptEl.innerHTML = '';
    for (const c of state.finalChunks) {
      const seg = document.createElement('span'); seg.className = 'seg';
      const ts = document.createElement('span'); ts.className = 'ts'; ts.textContent = '[' + fmtTime(c.t) + ']';
      const txt = document.createElement('span'); txt.textContent = ' ' + c.text;
      seg.appendChild(ts); seg.appendChild(txt);
      transcriptEl.appendChild(seg);
    }
    transcriptEl.scrollTop = transcriptEl.scrollHeight;
    return;
  }
  // live preview style (Web Speech)
  const final = state.finalChunks.map(c => c.text).join(' ');
  if (!final && !state.interim && !state.recording) {
    transcriptEl.innerHTML = '<span class="placeholder">' +
      (caps.speech ? 'Press Start to begin. Live transcript will appear here.'
                   : 'Live transcription is unavailable in this browser. Audio will be recorded; use “Transcribe with Whisper” after stopping for a transcript.') +
      '</span>';
    return;
  }
  transcriptEl.innerHTML = '<span class="final"></span><span class="interim"></span>';
  transcriptEl.firstChild.textContent = final + (final && state.interim ? ' ' : '');
  transcriptEl.lastChild.textContent = state.interim;
  transcriptEl.scrollTop = transcriptEl.scrollHeight;
}

function renderNotes() {
  notesEl.innerHTML = '';
  for (const n of state.notes) {
    const div = document.createElement('div'); div.className = 'note';
    const ts = document.createElement('span'); ts.className = 'ts'; ts.textContent = '[' + fmtTime(n.t) + ']';
    const txt = document.createElement('span'); txt.className = 'txt'; txt.textContent = n.text;
    div.appendChild(ts); div.appendChild(txt);
    if (n.source === 'mark') {
      const src = document.createElement('span'); src.className = 'src'; src.textContent = 'mark';
      div.appendChild(src);
    }
    notesEl.appendChild(div);
  }
  notesEl.scrollTop = notesEl.scrollHeight;
}

function tickTimer() { timerEl.textContent = fmtTime(nowOffset()); }
setInterval(tickTimer, 500);

function setupRecognition() {
  if (!caps.speech) return null;
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  const r = new SR();
  r.continuous = true;
  r.interimResults = true;
  r.lang = langEl.value;

  r.onresult = (e) => {
    if (state.whisperUsed) return; // don't overwrite Whisper output
    let interim = '';
    for (let i = e.resultIndex; i < e.results.length; i++) {
      const res = e.results[i];
      const text = res[0].transcript.trim();
      if (!text) continue;
      if (res.isFinal) state.finalChunks.push({ t: nowOffset(), text });
      else interim += (interim ? ' ' : '') + text;
    }
    state.interim = interim;
    renderTranscript();
  };
  r.onerror = (e) => {
    if (e.error === 'no-speech' || e.error === 'aborted') return;
    showError('Speech error: ' + e.error);
  };
  r.onend = () => {
    if (state.recording && !state.paused) {
      try { r.start(); } catch (_) {}
    }
  };
  return r;
}

function pickAudioMime() {
  if (typeof MediaRecorder === 'undefined') return '';
  const types = [
    'audio/mp4',                  // Safari
    'audio/webm;codecs=opus',     // Chrome/Firefox
    'audio/webm',
    'audio/ogg;codecs=opus',
  ];
  for (const t of types) {
    if (MediaRecorder.isTypeSupported(t)) return t;
  }
  return '';
}

function audioExtFromMime(mime) {
  if (!mime) return 'audio';
  if (mime.includes('mp4')) return 'm4a';
  if (mime.includes('webm')) return 'webm';
  if (mime.includes('ogg')) return 'ogg';
  return 'audio';
}

async function startAudio(stream) {
  if (!caps.audio) return false;
  const mime = pickAudioMime();
  let mr;
  try {
    mr = mime ? new MediaRecorder(stream, { mimeType: mime }) : new MediaRecorder(stream);
  } catch (e) {
    showError('Could not start audio recorder: ' + e.message);
    return false;
  }
  state.audioChunks = [];
  state.audioMime = mr.mimeType || mime || '';
  state.mediaRecorder = mr;
  mr.ondataavailable = (e) => { if (e.data && e.data.size) state.audioChunks.push(e.data); };
  mr.onstop = () => {
    if (!state.audioChunks.length) { state.audioBlob = null; return; }
    state.audioBlob = new Blob(state.audioChunks, { type: state.audioMime || 'audio/webm' });
    state.audioChunks = [];
    btnDownloadAudio.disabled = false;
    if (caps.whisper) btnWhisper.disabled = false;
  };
  mr.start(1000);
  return true;
}

function stopAudio() {
  try { state.mediaRecorder && state.mediaRecorder.state !== 'inactive' && state.mediaRecorder.stop(); } catch (_) {}
  state.mediaRecorder = null;
  if (state.audioStream) {
    state.audioStream.getTracks().forEach(t => t.stop());
    state.audioStream = null;
  }
}

async function startRecording() {
  clearError();

  if (!caps.mediaDevices) {
    if (!caps.secure) {
      const httpsUrl = httpsUrlForThisHost();
      showError(
        'Mic access blocked: this page is not on a secure context. ' +
        'iPhone Safari (and most browsers) only allow microphone access over https:// or http://localhost. ' +
        'Open ' + httpsUrl + ' instead (accept the self-signed cert warning once).'
      );
    } else {
      showError('This browser does not expose navigator.mediaDevices.getUserMedia. Update to a recent Safari/Chrome/Firefox.');
    }
    return;
  }

  let stream;
  try {
    stream = await navigator.mediaDevices.getUserMedia({ audio: true });
  } catch (e) {
    const name = e && e.name ? e.name : 'Error';
    let hint = '';
    if (name === 'NotAllowedError') hint = ' (Tap "AA" → Website Settings → Microphone → Allow on iOS, then retry.)';
    else if (name === 'NotFoundError') hint = ' (No microphone detected on this device.)';
    showError('Microphone error [' + name + ']: ' + (e.message || '') + hint);
    return;
  }
  state.audioStream = stream;

  // Reset transcript-related state for a new session
  state.finalChunks = [];
  state.notes = state.notes; // keep prior notes? clear instead for clarity
  state.notes = [];
  state.interim = '';
  state.audioBlob = null;
  state.whisperUsed = false;
  btnDownloadAudio.disabled = true;
  btnWhisper.disabled = true;
  setTranscriptTag('');
  renderTranscript();
  renderNotes();

  // Start audio recording (if supported)
  const audioOk = await startAudio(stream);

  // Start speech recognition (if supported)
  if (caps.speech) {
    state.recognition = setupRecognition();
    try { state.recognition.start(); } catch (e) { /* may throw if already started */ }
  }

  if (!caps.speech && !audioOk) {
    showError('Neither live transcription nor audio recording is supported in this browser.');
    stream.getTracks().forEach(t => t.stop());
    return;
  }

  state.recording = true;
  state.paused = false;
  state.startedAt = Date.now();
  state.elapsedBeforePause = 0;

  setStatus(caps.speech ? 'recording' : 'recording (audio only)', 'rec');
  btnRec.textContent = 'Stop';
  btnPause.disabled = false;
  btnPause.textContent = 'Pause';
  setTranscriptTag(caps.speech ? 'live' : 'audio only');
}

function stopRecording() {
  state.recording = false;
  if (state.startedAt && !state.paused) {
    state.elapsedBeforePause += (Date.now() - state.startedAt) / 1000;
  }
  state.startedAt = null;

  if (state.recognition) {
    try { state.recognition.stop(); } catch (_) {}
    state.recognition = null;
  }
  state.interim = '';

  stopAudio();

  setStatus('stopped', '');
  btnRec.textContent = 'Start Recording';
  btnPause.disabled = true;
  renderTranscript();
}

function togglePause() {
  if (!state.recording) return;
  if (!state.paused) {
    state.paused = true;
    if (state.startedAt) {
      state.elapsedBeforePause += (Date.now() - state.startedAt) / 1000;
      state.startedAt = null;
    }
    if (state.recognition) { try { state.recognition.stop(); } catch (_) {} }
    if (state.mediaRecorder && state.mediaRecorder.state === 'recording') {
      try { state.mediaRecorder.pause(); } catch (_) {}
    }
    setStatus('paused', 'on');
    btnPause.textContent = 'Resume';
  } else {
    state.paused = false;
    state.startedAt = Date.now();
    if (caps.speech) {
      if (!state.recognition) state.recognition = setupRecognition();
      try { state.recognition.start(); } catch (_) {}
    }
    if (state.mediaRecorder && state.mediaRecorder.state === 'paused') {
      try { state.mediaRecorder.resume(); } catch (_) {}
    }
    setStatus(caps.speech ? 'recording' : 'recording (audio only)', 'rec');
    btnPause.textContent = 'Pause';
  }
}

function clearAll() {
  if (state.recording) stopRecording();
  state.finalChunks = [];
  state.notes = [];
  state.interim = '';
  state.elapsedBeforePause = 0;
  state.audioBlob = null;
  state.audioChunks = [];
  state.whisperUsed = false;
  btnDownloadAudio.disabled = true;
  btnWhisper.disabled = true;
  setTranscriptTag('');
  renderTranscript();
  renderNotes();
  timerEl.textContent = '00:00';
  setStatus('idle', '');
  clearError();
}

function addNote(text, source) {
  const t = (text || '').trim();
  if (!t) return;
  state.notes.push({ t: nowOffset(), text: t, source: source || 'manual' });
  renderNotes();
}

function markMoment() { addNote('— moment marked —', 'mark'); }

function downloadAudio() {
  if (!state.audioBlob) return;
  const ext = audioExtFromMime(state.audioMime);
  const title = (titleEl.value || 'meeting').trim().replace(/[^\w\-]+/g, '_');
  const url = URL.createObjectURL(state.audioBlob);
  const a = document.createElement('a');
  a.href = url;
  a.download = title + '_' + new Date().toISOString().slice(0, 19).replace(/[:T]/g, '-') + '.' + ext;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 5000);
}

async function transcribeWithWhisper() {
  if (!state.audioBlob) {
    showError('No audio to transcribe yet. Record something first.');
    return;
  }
  if (state.recording) {
    showError('Stop recording before sending to Whisper.');
    return;
  }
  clearError();
  const prevLabel = btnWhisper.textContent;
  btnWhisper.disabled = true;
  btnWhisper.textContent = 'Transcribing…';
  setStatus('transcribing (Whisper)', 'busy');

  const ext = audioExtFromMime(state.audioMime);
  const form = new FormData();
  form.append('file', state.audioBlob, 'meeting.' + ext);
  form.append('model', 'whisper-1');
  const langCode = (langEl.value || '').split('-')[0];
  if (langCode) form.append('language', langCode);

  try {
    const res = await fetch('/transcribe', { method: 'POST', body: form });
    const ct = res.headers.get('content-type') || '';
    let data;
    if (ct.includes('application/json')) data = await res.json();
    else data = { error: await res.text() };

    if (!res.ok) {
      showError(data.error || ('Transcription failed (' + res.status + ')'));
    } else {
      if (Array.isArray(data.segments) && data.segments.length) {
        state.finalChunks = data.segments.map(s => ({
          t: typeof s.start === 'number' ? s.start : 0,
          text: (s.text || '').trim(),
        })).filter(c => c.text);
      } else if (typeof data.text === 'string' && data.text.trim()) {
        state.finalChunks = [{ t: 0, text: data.text.trim() }];
      } else {
        showError('Whisper returned no text.');
      }
      state.interim = '';
      state.whisperUsed = true;
      setTranscriptTag('whisper');
      renderTranscript();
    }
  } catch (e) {
    showError('Transcribe request failed: ' + e.message);
  } finally {
    btnWhisper.textContent = prevLabel;
    btnWhisper.disabled = !state.audioBlob;
    setStatus(state.recording ? 'recording' : 'stopped', state.recording ? 'rec' : '');
  }
}

function buildMarkdown() {
  const title = (titleEl.value || 'Meeting').trim();
  const dateStr = new Date().toISOString().replace('T', ' ').slice(0, 16) + ' UTC';
  const lines = [];
  lines.push('# ' + title);
  lines.push('');
  lines.push('_Recorded: ' + dateStr + '_  ');
  lines.push('_Duration: ' + fmtTime(nowOffset()) + '_  ');
  lines.push('_Transcript source: ' + (state.whisperUsed ? 'OpenAI Whisper' : (caps.speech ? 'Web Speech (live)' : 'manual notes only')) + '_');
  lines.push('');
  if (state.notes.length) {
    lines.push('## Notes');
    for (const n of state.notes) {
      lines.push('- **[' + fmtTime(n.t) + ']** ' + n.text + (n.source === 'mark' ? ' _(mark)_' : ''));
    }
    lines.push('');
  }
  lines.push('## Transcript');
  if (!state.finalChunks.length) {
    lines.push('_(no transcript captured)_');
  } else {
    for (const c of state.finalChunks) {
      lines.push('**[' + fmtTime(c.t) + ']** ' + c.text);
      lines.push('');
    }
  }
  return lines.join('\n');
}

function buildPlainText() {
  return buildMarkdown()
    .replace(/^#+ /gm, '')
    .replace(/\*\*(.+?)\*\*/g, '$1')
    .replace(/_(.+?)_/g, '$1');
}

function downloadMd() {
  const md = buildMarkdown();
  const title = (titleEl.value || 'meeting').trim().replace(/[^\w\-]+/g, '_');
  const blob = new Blob([md], { type: 'text/markdown' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = title + '_' + new Date().toISOString().slice(0, 19).replace(/[:T]/g, '-') + '.md';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

async function copyAll() {
  try {
    await navigator.clipboard.writeText(buildPlainText());
    btnCopy.textContent = 'Copied!';
    setTimeout(() => btnCopy.textContent = 'Copy to clipboard', 1500);
  } catch (e) { showError('Clipboard blocked: ' + e.message); }
}

async function openInGoogleDocs() {
  try { await navigator.clipboard.writeText(buildPlainText()); } catch (_) {}
  window.open('https://docs.new', '_blank', 'noopener');
  $('hint').textContent = 'New Doc opened. Content is on your clipboard — just paste (Ctrl/Cmd-V).';
}

function saveToDrive() {
  downloadMd();
  window.open('https://drive.google.com/drive/u/0/my-drive', '_blank', 'noopener');
  $('hint').textContent = 'File downloaded and Drive opened. Drag the .md into Drive (right-click → Open with Google Docs to convert).';
}

btnRec.addEventListener('click', () => state.recording ? stopRecording() : startRecording());
btnPause.addEventListener('click', togglePause);
btnClear.addEventListener('click', () => { if (confirm('Clear transcript, notes, and audio?')) clearAll(); });
btnWhisper.addEventListener('click', transcribeWithWhisper);
btnDownloadAudio.addEventListener('click', downloadAudio);
btnDownload.addEventListener('click', downloadMd);
btnCopy.addEventListener('click', copyAll);
btnOpenDoc.addEventListener('click', openInGoogleDocs);
btnSaveDrive.addEventListener('click', saveToDrive);
btnAddNote.addEventListener('click', () => { addNote(noteIn.value); noteIn.value = ''; });
btnMark.addEventListener('click', markMoment);
noteIn.addEventListener('keydown', (e) => {
  if (e.key === 'Enter') { addNote(noteIn.value); noteIn.value = ''; }
});
langEl.addEventListener('change', () => {
  if (state.recognition) {
    state.recognition.lang = langEl.value;
    try { state.recognition.stop(); } catch (_) {}
  }
});

setStatus('idle', '');

function describeModes() {
  const bits = [];
  bits.push('<b>live transcript:</b> ' + (caps.speech ? 'on (browser)' : 'unavailable'));
  bits.push('<b>audio capture:</b> ' + (caps.audio ? 'on' : 'unavailable'));
  bits.push('<b>whisper backend:</b> ' + (caps.whisper ? 'configured' : 'not configured'));
  modesEl.innerHTML = bits.join(' · ');
}

(async function probeBackend() {
  try {
    const res = await fetch('/health');
    const data = await res.json();
    caps.whisper = !!data.whisper_configured;
  } catch (_) { caps.whisper = false; }
  describeModes();
  if (!caps.whisper) {
    btnWhisper.title = 'Set OPENAI_API_KEY in the sp-hub environment to enable Whisper.';
  }
  if (!caps.mediaDevices && !caps.secure) {
    const httpsUrl = httpsUrlForThisHost();
    showError(
      'Insecure context detected (' + window.location.protocol + '//). ' +
      'iPhone Safari requires HTTPS for mic access. Open ' + httpsUrl + ' and accept the cert warning.'
    );
    btnRec.disabled = true;
  } else if (!caps.speech && !caps.audio) {
    showError('This browser supports neither live transcription nor audio recording. You can still take manual notes.');
    btnRec.disabled = true;
  } else if (!caps.speech) {
    showError('Live transcription not available in this browser. Audio will be recorded; use “Transcribe with Whisper” after stopping for a transcript.');
  }
  renderTranscript();
})();
</script>
</body>
</html>
