[package]
name = "sp-hub"
version = "0.1.0"
edition = "2024"
description = "Solarpunk hub services - web terminal + mesh bridge"

[dependencies]
tokio = { version = "1", features = ["full", "process", "signal"] }
axum = { version = "0.8", features = ["ws", "multipart"] }
axum-server = { version = "0.7", features = ["tls-rustls"] }
reqwest = { version = "0.12", features = ["json", "rustls-tls", "multipart"], default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4", features = ["derive"] }
nix = { version = "0.30", features = ["term", "signal", "process", "ioctl", "fs"] }
tower-http = { version = "0.6", features = ["cors"] }
libc = "0.2.183"
rcgen = "0.13"
rustls = { version = "0.23", default-features = false, features = ["aws-lc-rs"] }
time = "0.3"
bytes = "1"
tokio-stream = { version = "0.1", features = ["sync"] }
futures-util = "0.3"

[profile.release]
opt-level = "s"
lto = true
strip = true
